<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Development – Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dev-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .dev-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #3b82f6);
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: #fef3c7;
            border: 1.5px solid #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-wrapper i {
            font-size: 32px;
            color: #d97706;
        }

        .tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #d97706;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border: 1.5px solid #000000;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #ffffff;
            color: #334155;
            border: 1.5px solid #000000;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <div class="dev-card">
        <div class="icon-wrapper">
            <i class="bi bi-tools"></i>
        </div>
        <span class="tag">Work in Progress</span>
        <h1>Feature Under Development</h1>
        <p>This module is currently being built and tested by our engineering team. Please check back later!</p>

        <div class="actions">
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Go Back
            </button>
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </div>

</body>

</html>
