<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/../../static/css/staff.css">
    <link rel="stylesheet" href="/../../static/css/message.css">
    <script src="/../../static/scripts/scrit.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <title>History — GSD Parking</title>

    <style>
        *, *::before, *::after {
            font-family: 'Roboto', sans-serif !important;
        }

        .header { background:#fff; border-bottom:1px solid #000000; padding:22px 32px; box-shadow:0 1px 8px rgba(0,0,0,.06); }
        .header h1 { font-size:20px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:8px; }
        .header p { font-size:11px; color:#94a3b8; font-family:'Roboto',sans-serif !important; margin-top:3px; letter-spacing:.08em; }
        .header .bi { color:#2563eb; }

        .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:28px 32px 0; }
        .stat-item { overflow:hidden; background:#fff; border:1px solid #000000; padding:20px; position:relative; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.07); }
        .stat-item::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:12px 12px 0 0; }
        .stat-item:nth-child(1)::before { background:#2563eb; }
        .stat-item:nth-child(2)::before { background:#ef4444; }
        .stat-item:nth-child(3)::before { background:#f59e0b; }
        .stat-item:nth-child(4)::before { background:#10b981; }
        .stat-item h4 { font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.14em; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
        .stat-item .num { font-size:36px; font-weight:800; line-height:1; }
        .stat-item:nth-child(1) .num { color:#2563eb; }
        .stat-item:nth-child(2) .num { color:#ef4444; }
        .stat-item:nth-child(3) .num { color:#f59e0b; }
        .stat-item:nth-child(4) .num { color:#10b981; }

        .section { margin:24px 32px; background:#fff; border:1px solid #000000; border-radius:12px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.07); }
        .section-head { padding:14px 20px; background:#f5f9ff; border-bottom:1px solid #000000; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        .section-head-left { display:flex; align-items:center; gap:8px; }
        .section-head-left::before { content:''; width:3px; height:14px; background:#2563eb; border-radius:2px; }
        .section-head h2 { font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.1em; }
        .section-head .bi { color:#2563eb; }

        table { width:100%; border-collapse:collapse; }
        th,td { padding:12px 16px; text-align:left; font-size:12px; }
        th { background:#f5f9ff; color:#64748b; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border-bottom:1px solid #000000; }
        td { color:#334155; border-bottom:1px solid #000000; }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover td { background:#f8faff; }

        /* Column layouts */
        .recent-table tr { display:grid; grid-template-columns:50px 1.6fr 120px 100px 130px; }
        .all-table tr    { display:grid; grid-template-columns:50px 1fr 130px 100px 130px 110px; }

        .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; font-size:10px; font-weight:700; letter-spacing:.06em; border-radius:20px; }
        .badge.active   { background:#d1fae5; color:#065f46; border:1px solid #000000; }
        .badge.expired  { background:#fef3c7; color:#92400e; border:1px solid #000000; }
        .badge.rejected { background:#fee2e2; color:#991b1b; border:1px solid #000000; }

        /* ─── PAGINATION ─── */
        .pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f5f9ff; border-top:1px solid #000000; flex-wrap:wrap; gap:8px; }
        .pg-info { font-size:11px; color:#94a3b8; }
        .pg-btns { display:flex; gap:5px; }
        .pg-btn { padding:5px 11px; border:1.5px solid #000000; background:#fff; color:#64748b; font-size:11px; font-weight:700; cursor:pointer; border-radius:6px; transition:all .2s; }
        .pg-btn:hover:not(:disabled) { border-color:#000000; color:#2563eb; background:#eff6ff; }
        .pg-btn.active { background:#2563eb; border-color:#000000; color:#fff; }
        .pg-btn:disabled { opacity:.4; cursor:not-allowed; }

        .empty-row { display:block !important; }
        .empty-row td { display:block; padding:32px; text-align:center; color:#94a3b8; font-size:11px; border-bottom:none !important; }
    </style>
</head>
<body>
    <aside>
        <div class="logos">
            <div class="circle">P</div>
            <span>STAFF PORTAL</span>
        </div>
        <div class="buttons">
            <a href="/staff/generate"><i class="bi bi-qr-code"></i> Generator</a>
            <a href="/staff/history" class="active"><i class="bi bi-stopwatch"></i> History</a>
            <a href="/staff/search"><i class="bi bi-search"></i> Search</a>
            <a href="/staff/profile"><i class="bi bi-people"></i> Profile</a>
        </div>
        <div class="logout">
            <button onclick="window.location.href='/auth/logout'"><i class="bi bi-box-arrow-left"></i> Logout</button>
        </div>
    </aside>

    <div class="right">
        <div class="header">
            <h1><i class="bi bi-stopwatch-fill"></i> QR History</h1>
            <p>YOUR GENERATED AND SCANNED QR ACTIVITY</p>
        </div>

        <div class="stat-row">
            <div class="stat-item"><h4><i class="bi bi-qr-code"></i> Total QR</h4><div class="num" id="statTotal">—</div></div>
            <div class="stat-item"><h4><i class="bi bi-x-circle"></i> Revoked</h4><div class="num" id="statRevoked">—</div></div>
            <div class="stat-item"><h4><i class="bi bi-hourglass-bottom"></i> Expired</h4><div class="num" id="statExpired">—</div></div>
            <div class="stat-item"><h4><i class="bi bi-check-circle"></i> Active</h4><div class="num" id="statActive">—</div></div>
        </div>

        <div class="section">
            <div class="section-head">
                <div class="section-head-left">
                    <i class="bi bi-clock-history"></i>
                    <h2>Recently Created (Latest 5)</h2>
                </div>
            </div>
            <table class="recent-table">
                <thead>
                    <tr><th>#</th><th>QR Data</th><th>Plate</th><th>Status</th><th>Created At</th></tr>
                </thead>
                <tbody id="recentBody">
                    <tr class="empty-row"><td>Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section" style="margin-bottom:32px;">
            <div class="section-head">
                <div class="section-head-left">
                    <i class="bi bi-table"></i>
                    <h2>All QR Codes</h2>
                </div>
                <span class="pg-info" id="allPgInfo">—</span>
            </div>
            <table class="all-table" id="qrtab">
                <thead>
                    <tr><th>#</th><th>QR Data</th><th>Plate</th><th>Status</th><th>Created At</th><th>By</th></tr>
                </thead>
                <tbody id="allBody">
                    <tr class="empty-row"><td>Loading…</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span class="pg-info" id="allPgBottom">—</span>
                <div class="pg-btns">
                    <button class="pg-btn" id="btnPrev" onclick="changePage(allPage - 1)" disabled>‹ Prev</button>
                    <div id="pgNumbers" style="display:flex;gap:5px;"></div>
                    <button class="pg-btn" id="btnNext" onclick="changePage(allPage + 1)" disabled>Next ›</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const LIMIT = 5;
        let allPage  = 1;
        let allPages = 1;

        function effectiveStatus(dbStatus, expiryStr) {
            if (dbStatus && dbStatus !== 'active') return dbStatus; // revoked, etc.
            if (expiryStr !== 'None' && expiryStr !== '—') {
                const expiry = new Date(String(expiryStr));

                if (expiry < new Date()) return 'expired';
            }

            return dbStatus || 'active';
        }

        function createEmptyRow(message) {
            const tr = document.createElement("tr");
            tr.className = "empty-row";
            const td = document.createElement("td");
            td.textContent = message;
            tr.appendChild(td);
            return tr;
        }

        async function getRecentQR() {
            const res = await API.get("/staff/recentqr");
            const recentBody = document.getElementById("recentBody");
            recentBody.textContent = "";


            if (!res || res.status !== "good") {
                recentBody.appendChild(createEmptyRow("No recent records"));
                return;
            }

            res.data.forEach((d, i) => {
                const status = effectiveStatus(d[8], d[7]);

                const tr = document.createElement("tr");

                const td1 = document.createElement("td");
                td1.style.color = "#94a3b8";
                td1.textContent = i + 1;

                const td2 = document.createElement("td");
                td2.style.color = "#2563eb";
                td2.style.fontWeight = "700";
                td2.style.fontSize = "11px";
                td2.textContent = d[1];

                const td3 = document.createElement("td");
                td3.style.color = "#334155";
                td3.textContent = d[2] || "—";

                const td4 = document.createElement("td");
                const span = document.createElement("span");
                span.className = `badge ${status}`;
                span.textContent = status;
                td4.appendChild(span);

                const td5 = document.createElement("td");
                td5.style.color = "#64748b";
                td5.style.fontSize = "11px";
                td5.textContent = d[10] || "—";

                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tr.appendChild(td5);

                recentBody.appendChild(tr);
            });
        }

        async function getAllQR(page = 1) {
            allPage = page;
            const res = await API.get(`/staff/all_qr?page=${page}&limit=${LIMIT}`);
            
            
            const allBody = document.getElementById("allBody");
            allBody.textContent = "";

            if (!res || res.status !== "good") {
                allBody.appendChild(createEmptyRow("No records yet"));
                return;
            }

            allPages = res.pages;

            res.data.forEach((d, i) => {
                const status = effectiveStatus(d[8], d[7]);

                const tr = document.createElement("tr");

                const td1 = document.createElement("td");
                td1.style.color = "#94a3b8";
                td1.textContent = (page - 1) * LIMIT + i + 1;

                const td2 = document.createElement("td");
                td2.style.color = "#2563eb";
                td2.style.fontWeight = "700";
                td2.style.fontSize = "11px";
                td2.style.overflow = "hidden";
                td2.style.textOverflow = "ellipsis";
                td2.style.whiteSpace = "nowrap";
                td2.textContent = d[1];

                const td3 = document.createElement("td");
                td3.style.color = "#334155";
                td3.textContent = d[2] || "—";

                const td4 = document.createElement("td");
                const span = document.createElement("span");
                span.className = `badge ${status}`;
                span.textContent = status;
                td4.appendChild(span);

                const td5 = document.createElement("td");
                td5.style.color = "#64748b";
                td5.style.fontSize = "11px";
                td5.textContent = d[10] || "—";

                const td6 = document.createElement("td");
                td6.style.color = "#64748b";
                td6.style.fontSize = "11px";
                td6.textContent = d[14] || "—";

                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tr.appendChild(td5);
                tr.appendChild(td6);

                allBody.appendChild(tr);
            });

            updatePager(res.total, page, res.pages);
        }

        async function updateStats() {
            d = await API.get("/staff/stats");
            total = d.data
            const now = new Date();
            document.getElementById("statTotal").textContent = total[3];

            
            document.getElementById("statActive").textContent  = total[0];
            document.getElementById("statExpired").textContent = total[1];
            document.getElementById("statRevoked").textContent = total[2];
        }

        function updatePager(total, page, pages) {
            const info = `Page ${page} of ${pages}  (${total} total)`;
            document.getElementById("allPgInfo").textContent   = info;
            document.getElementById("allPgBottom").textContent = info;
            document.getElementById("btnPrev").disabled = page <= 1;
            document.getElementById("btnNext").disabled = page >= pages;

            const nums = document.getElementById("pgNumbers");
            nums.textContent = "";
            let start = Math.max(1, page - 2);
            let end   = Math.min(pages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            for (let p = start; p <= end; p++) {
                const btn = document.createElement("button");
                btn.className = `pg-btn${p === page ? " active" : ""}`;
                btn.textContent = p;
                btn.onclick = () => changePage(p);
                nums.appendChild(btn);
            }
        }

        function changePage(p) {
            if (p < 1 || p > allPages) return;
            getAllQR(p);
        }

        async function init() {
            await getRecentQR();
            await getAllQR(1);
            await updateStats();
        }

        init();
        setInterval(init, 30000);
    </script>
</body>
</html>
