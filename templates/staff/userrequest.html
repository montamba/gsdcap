<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/../../static/css/staff.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/../../static/css/message.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/../../static/scripts/scrit.js"></script>
    <title>Generator — GSD Parking</title>

    <style>
        *, *::before, *::after {
            font-family: 'Roboto', sans-serif !important;
        }

        .right{
            position:relative;
        }

        .header { background:#fff; border-bottom:1px solid #000000; padding:22px 32px; box-shadow:0 1px 8px rgba(0,0,0,.06); }
        .header h1 { font-size:20px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:8px; }
        .header p  { font-size:11px; color:#94a3b8; font-family:'Roboto',sans-serif !important; margin-top:3px; letter-spacing:.08em; }
        .header .bi { color:#2563eb; }

        .gen-wrap { display:flex; gap:20px; padding:28px 32px; align-items:flex-start; }

        .gen-form { background:#fff; border:1px solid #000000; width:380px; flex-shrink:0; border-radius:5px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.07); }

        .card-header { padding:14px 20px; background:#f5f9ff; border-bottom:1px solid #000000; display:flex; align-items:center; gap:8px; }
        .card-header::before { content:''; width:3px; height:14px; background:#2563eb; border-radius:5px; }
        .card-header h2 { font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.1em; }
        .card-header .bi { color:#2563eb; }

        .form-body { padding:22px; display:flex; flex-direction:column; gap:14px; }

        .form-divider { display:flex; align-items:center; gap:10px; margin:2px 0; }
        .form-divider::before, .form-divider::after { content:''; flex:1; height:1px; background:#000000; }
        .form-divider span { font-size:9px; font-weight:700; color:#94a3b8; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }

        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-group label { font-size:10px; font-weight:700; color:#94a3b8; letter-spacing:.14em; text-transform:uppercase; }

        .code-row { display:flex; gap:6px; align-items:stretch; }
        .code-row input { flex:1; padding:11px 14px; background:#f0f6ff; border:1.5px solid #000000; color:#2563eb; font-size:13px; font-weight:700; outline:none; border-radius:5px; letter-spacing:.06em; }
        .btn-regen { padding:0 12px; background:#eff6ff; border:1.5px solid #000000; color:#2563eb; border-radius:5px; cursor:pointer; font-size:16px; transition:all .2s; flex-shrink:0; }
        .btn-regen:hover { background:#dbeafe; border-color:#000000; }
        .btn-regen:active { transform:rotate(180deg); }

        .form-group input[type=text],
        .form-group input[type=email],
        .form-group input[type=date],
        .form-group select { padding:11px 14px; background:#f8faff; border:1.5px solid #000000; color:#0f172a; font-size:13px; outline:none; transition:border-color .2s; border-radius:5px; }
        .form-group input:focus, .form-group select:focus { border-color:#000000; box-shadow:0 0 0 3px rgba(0,0,0,.1); background:#fff; }
        .form-group input::placeholder { color:#cbd5e1; }

        .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
        .btn-gen { padding:11px; background:linear-gradient(135deg,#2563eb,#0ea5e9); border:1px solid #000000; color:#fff; font-size:13px; font-weight:800; cursor:pointer; letter-spacing:.04em; transition:all .2s; border-radius:5px; box-shadow:0 3px 10px rgba(0,0,0,.15); }
        .btn-gen:hover { opacity:.9; box-shadow:0 5px 16px rgba(0,0,0,.25); }
        
        .btn-save { padding:11px; background:#fff; border:1.5px solid #000000; color:#64748b; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:.04em; transition:all .2s; border-radius:5px; display:flex; align-items:center; justify-content:center; gap:6px; }
        .btn-save:hover:not(:disabled) { border-color:#000000; color:#2563eb; background:#eff6ff; }
        .btn-save:disabled { opacity:.6; cursor:not-allowed; }

        .btn-email { padding:11px; background:#fff; border:1.5px solid #000000; color:#059669; font-size:13px; font-weight:700; cursor:pointer; letter-spacing:.04em; transition:all .2s; border-radius:5px; display:flex; align-items:center; justify-content:center; gap:6px; }
        .btn-email:hover:not(:disabled) { background:#ecfdf5; border-color:#000000; }
        .btn-email:disabled { opacity:.45; cursor:not-allowed; }

        .qr-preview { background:#fff; border:1px solid #000000; flex:1; border-radius:5px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.07); }
        .qr-inner { padding:32px; display:flex; flex-direction:column; align-items:center; gap:16px; }
        .qr-box { width:220px; height:220px; border:2px solid #000000; background:#f5f9ff; display:grid; place-items:center; border-radius:5px; }
        .qr-box .placeholder-text { font-size:11px; color:#94a3b8; letter-spacing:.1em; text-align:center; }
        #qrcode { display:flex; align-items:center; justify-content:center; }
        #qrcode img, #qrcode canvas { max-width:200px; max-height:200px; }
        .qr-code-label { font-size:13px; font-weight:700; color:#2563eb; letter-spacing:.08em; text-align:center; }

        .owner-card { width:100%; background:#f5f9ff; border:1px solid #000000; border-radius:5px; padding:14px 18px; display:none; flex-direction:column; gap:7px; }
        .owner-card.show { display:flex; }
        .owner-row { display:flex; align-items:center; gap:10px; font-size:12px; }
        .owner-row .lbl { font-size:9px; font-weight:700; color:#94a3b8; letter-spacing:.12em; text-transform:uppercase; min-width:60px; }
        .owner-row .val { color:#0f172a; font-weight:600; }

        .btn-print { padding:8px 18px; border:1.5px solid #000000; background:#fff; color:#64748b; border-radius:5px; cursor:pointer; font-size:13px; font-weight:600; transition:all .2s; }
        .btn-print:hover { border-color:#000000; color:#2563eb; background:#eff6ff; }

        /* ─── TABLE + PAGINATION ─── */
        .table-section { padding:0 32px 32px; }
        .section-header { display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid #000000; padding:20px 0 16px; flex-wrap:wrap; }
        .section-header-left { display:flex; align-items:center; gap:8px; }
        .section-header-left::before { content:''; width:3px; height:14px; background:#2563eb; border-radius:5px; }
        .section-header h3 { font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.1em; }

        .table-wrap { background:#fff; border:1px solid #000000; border-radius:5px; overflow:hidden; }
        table { width:100%; border-collapse:collapse; }
        th,td { padding:12px 16px; text-align:left; font-size:12px; }
        th { background:#f5f9ff; color:#64748b; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border-bottom:1px solid #000000; }
        td { color:#334155; border-bottom:1px solid #000000; }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover td { background:#f8faff; }
        table.qr-row-table tr { display:grid; grid-template-columns:40px 1fr 1fr 130px 130px; }

        .pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f5f9ff; border-top:1px solid #000000; flex-wrap:wrap; gap:8px; }
        .pg-info { font-size:11px; color:#94a3b8; }
        .pg-btns { display:flex; gap:5px; }
        .pg-btn { padding:5px 11px; border:1.5px solid #000000; background:#fff; color:#64748b; font-size:11px; font-weight:700; cursor:pointer; border-radius:5px; transition:all .2s; }
        .pg-btn:hover:not(:disabled) { border-color:#000000; color:#2563eb; background:#eff6ff; }
        .pg-btn.active { background:#2563eb; border-color:#000000; color:#fff; }
        .pg-btn:disabled { opacity:.4; cursor:not-allowed; }
       

        @media print {
            body * { visibility:hidden; }
            .qr-box, .qr-box * { visibility:visible; }
            .qr-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:1px solid #000000; background:#fff; width:300px; height:300px; display:grid; place-items:center; }
        }
    </style>
</head>
<body>
    <aside>
        <div class="logos">
            <div class="circle">P</div>
            <span>STAFF PORTAL</span>
        </div>
        <div class="buttons">
            <a href="/staff/generate" ><i class="bi bi-qr-code"></i> Generator</a>
            <a href="/staff/history"><i class="bi bi-stopwatch"></i> History</a>
            <a href="/staff/search"><i class="bi bi-search"></i> Search</a>
            <a href="/staff/profile"><i class="bi bi-people"></i> Profile</a>
            <a href="/staff/userreques" class="active"><i class="bi bi-people"></i> User Request</a>
        </div>
        <div class="logout">
            <button onclick="window.location.href='/auth/logout'"><i class="bi bi-box-arrow-left"></i> Logout</button>
        </div>
    </aside>

    <div class="right">
        <div class="header">
            <h1><i class="bi bi-qr-code"></i> USER REQUEST</h1>
            <p>USER REQUEST FOR RENEWWAL OR QR CODES</p>
        </div>

        

        <div class="table-section">
            <div class="section-header">
                <div class="section-header-left">
                    <h3>Renewal Request</h3>
                </div>
                <span class="pg-info" id="myPgInfo">—</span>
            </div>
            <div class="table-wrap">
                <table class="qr-row-table" id="qrtab">
                    <thead>
                        <tr><th>#</th><th>QR DATA</th><th>Plate</th><th>orcr</th><th>Created At</th></tr>
                    </thead>
                    <tbody id="qrBody">
                        <tr><td style="color:#94a3b8;">—</td><td style="color:#94a3b8;">No records yet</td><td>—</td><td>—</td><td>—</td></tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <span class="pg-info" id="myPgBottom">—</span>
                    <div class="pg-btns">
                        <button class="pg-btn" id="myBtnPrev" onclick="changeMyPage(myPage - 1)" disabled>‹ Prev</button>
                        <div id="myPgNumbers" style="display:flex;gap:5px;"></div>
                        <button class="pg-btn" id="myBtnNext" onclick="changeMyPage(myPage + 1)" disabled>Next ›</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    
</body>
</html>
