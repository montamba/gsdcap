<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard Scan History — GSD Parking</title>
    <link rel="stylesheet" href="/../../static/css/style.css">
    <link rel="stylesheet" href="/../../static/css/message.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="/../../static/scripts/scrit.js"></script>
    <style>
        .page-header { background:#fff; border-bottom:1px solid #000; padding:24px 36px; box-shadow:0 1px 8px rgba(37,99,235,.06); }
        .page-header h1 { font-size:22px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:10px; }
        .page-header h1 i { color:#2563eb; }
        .page-header p { font-size:11px; color:#94a3b8; font-family:'Space Mono',monospace; margin-top:4px; letter-spacing:.08em; text-transform:uppercase; }
        .inner { padding:28px 36px; }

        /* stats */
        .stat-strip { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:24px; }
        .stat { background:#fff; border:1px solid #000; padding:18px 20px; position:relative; overflow:hidden; border-radius:12px; box-shadow:0 1px 6px rgba(37,99,235,.07); }
        .stat::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
        .stat:nth-child(1)::before { background:#2563eb; } .stat:nth-child(2)::before { background:#10b981; }
        .stat:nth-child(3)::before { background:#f59e0b; } .stat:nth-child(4)::before { background:#ef4444; }
        .stat:nth-child(5)::before { background:#8b5cf6; }
        .stat-label { font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.15em; font-family:'Space Mono',monospace; margin-bottom:8px; }
        .stat-num { font-size:32px; font-weight:800; font-family:'Space Mono',monospace; line-height:1; }
        .stat:nth-child(1) .stat-num { color:#2563eb; } .stat:nth-child(2) .stat-num { color:#10b981; }
        .stat:nth-child(3) .stat-num { color:#f59e0b; } .stat:nth-child(4) .stat-num { color:#ef4444; }
        .stat:nth-child(5) .stat-num { color:#8b5cf6; }

        /* filters */
        .section { background:#fff; border:1px solid #000; margin-bottom:24px; overflow:hidden; border-radius:12px; box-shadow:0 1px 6px rgba(37,99,235,.07); }
        .section-head { padding:14px 22px; background:#f5f9ff; border-bottom:1px solid #000; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .section-head-left { display:flex; align-items:center; gap:10px; }
        .section-head-left::before { content:''; width:3px; height:14px; background:#2563eb; border-radius:2px; }
        .section-head h2 { font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.12em; font-family:'Space Mono',monospace; }
        .section-head i { color:#2563eb; }

        .filters { padding:18px 22px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:end; }
        .f { display:flex; flex-direction:column; gap:6px; min-width:0; }
        .f label { font-size:10px; font-weight:700; color:#94a3b8; letter-spacing:.14em; text-transform:uppercase; font-family:'Space Mono',monospace; }
        .f input, .f select { padding:10px 12px; background:#f8faff; border:1.5px solid #000; border-radius:8px; font-size:13px; color:#0f172a; outline:none; width:100%; font-family:'Syne',sans-serif; }
        .f input:focus, .f select:focus { background:#fff; box-shadow:0 0 0 3px rgba(0,0,0,.1); }
        .f-actions { display:flex; gap:8px; grid-column:span 2; }
        .btn { padding:10px 18px; border-radius:8px; border:1px solid #000; font-family:'Syne',sans-serif; font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .2s; }
        .btn-primary { background:#2563eb; color:#fff; }
        .btn-ghost { background:#fff; color:#64748b; }
        .btn-export { background:#10b981; color:#fff; margin-left:auto; }
        .btn:hover { opacity:.9; transform:translateY(-1px); }

        /* table */
        .table-scroll { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:980px; }
        th,td { padding:12px 14px; text-align:left; font-size:12px; }
        th { background:#f5f9ff; color:#64748b; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border-bottom:1px solid #000; }
        td { color:#334155; border-bottom:1px solid #000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        tr:last-child td { border-bottom:none; }
        tbody tr:hover td { background:#f8faff; }
        .scan-table tr { display:grid; grid-template-columns:50px 150px 1fr 110px 1.2fr 100px 70px 100px 70px; }
        .mono { font-family:'Space Mono',monospace; }

        .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; font-size:10px; font-weight:700; font-family:'Space Mono',monospace; letter-spacing:.06em; border-radius:20px; border:1px solid #000; }
        .badge-ok { background:#d1fae5; color:#065f46; } .badge-fail { background:#fee2e2; color:#991b1b; } .badge-exp { background:#fef3c7; color:#92400e; }
        .action-entry { color:#2563eb; font-weight:700; font-family:'Space Mono',monospace; font-size:10px; }
        .action-exit { color:#ef4444; font-weight:700; font-family:'Space Mono',monospace; font-size:10px; }

        .empty-row { display:block !important; }
        .empty-row td { display:block; padding:36px; text-align:center; color:#94a3b8; font-family:'Space Mono',monospace; font-size:11px; border-bottom:none !important; white-space:normal; }

        .pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f5f9ff; border-top:1px solid #000; flex-wrap:wrap; gap:8px; }
        .pg-info { font-size:11px; font-family:'Space Mono',monospace; color:#94a3b8; }
        .pg-btns { display:flex; gap:5px; }
        .pg-btn { padding:5px 11px; border:1.5px solid #000; background:#fff; color:#64748b; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; cursor:pointer; border-radius:6px; transition:all .2s; }
        .pg-btn:hover:not(:disabled) { color:#2563eb; background:#eff6ff; }
        .pg-btn.active { background:#2563eb; color:#fff; }
        .pg-btn:disabled { opacity:.4; cursor:not-allowed; }

        @media (max-width:1100px) { .stat-strip { grid-template-columns:repeat(3,1fr); } .filters { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:600px) { .inner { padding:16px; } .stat-strip { grid-template-columns:repeat(2,1fr); } .filters { grid-template-columns:1fr; } .f-actions { grid-column:span 1; flex-wrap:wrap; } .btn-export { margin-left:0; } }
    </style>
</head>
<body>
    {% set active_page = 'guard_history' %}{% include "admin/_sidebar.html" %}

    <div class="right">
        <div class="page-header">
            <div>
                <h1><i class="bi bi-shield-check"></i> Guard Scan History</h1>
                <p>Every scan and manual entry logged by every guard</p>
            </div>
        </div>

        <div class="inner">
            <div class="stat-strip">
                <div class="stat"><div class="stat-label">Total</div><div class="stat-num" id="sTotal">—</div></div>
                <div class="stat"><div class="stat-label">Accepted</div><div class="stat-num" id="sAccepted">—</div></div>
                <div class="stat"><div class="stat-label">Expired</div><div class="stat-num" id="sExpired">—</div></div>
                <div class="stat"><div class="stat-label">Failed</div><div class="stat-num" id="sFailed">—</div></div>
                <div class="stat"><div class="stat-label">Unauthorized</div><div class="stat-num" id="sUnauth">—</div></div>
            </div>

            <div class="section">
                <div class="section-head">
                    <div class="section-head-left"><i class="bi bi-funnel-fill"></i><h2>Filters</h2></div>
                </div>
                <div class="filters">
                    <div class="f"><label for="fGuard">Guard</label>
                        <select id="fGuard"><option value="">All guards</option></select></div>
                    <div class="f"><label for="fStatus">Result</label>
                        <select id="fStatus"><option value="">All</option><option value="accepted">Accepted</option><option value="expired">Expired</option><option value="failed">Failed</option></select></div>
                    <div class="f"><label for="fAction">Action</label>
                        <select id="fAction"><option value="">Entry &amp; exit</option><option value="entry">Entry</option><option value="exit">Exit</option></select></div>
                    <div class="f"><label for="fAuth">Authorization</label>
                        <select id="fAuth"><option value="">All</option><option value="1">Authorized</option><option value="0">Unauthorized</option></select></div>
                    <div class="f"><label for="fFrom">From</label><input type="date" id="fFrom"></div>
                    <div class="f"><label for="fTo">To</label><input type="date" id="fTo"></div>
                    <div class="f"><label for="fQ">Plate or QR code</label><input type="text" id="fQ" maxlength="50" placeholder="Search…"></div>
                    <div class="f f-actions">
                        <button class="btn btn-primary" id="btnApply"><i class="bi bi-search"></i> Apply</button>
                        <button class="btn btn-ghost" id="btnClear"><i class="bi bi-x-lg"></i> Clear</button>
                        <button class="btn btn-export" id="btnExport"><i class="bi bi-download"></i> CSV</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-head">
                    <div class="section-head-left"><i class="bi bi-table"></i><h2>Scan Log</h2></div>
                    <span class="pg-info" id="pgInfo">—</span>
                </div>
                <div class="table-scroll">
                    <table class="scan-table">
                        <thead>
                            <tr><th>#</th><th>Date</th><th>Guard</th><th>Plate</th><th>QR Code</th><th>Dept</th><th>Action</th><th>Result</th><th>Auth</th></tr>
                        </thead>
                        <tbody id="body"><tr class="empty-row"><td>Loading…</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pg-info" id="pgBottom">—</span>
                    <div class="pg-btns">
                        <button class="pg-btn" id="btnPrev" disabled>‹ Prev</button>
                        <div id="pgNums" style="display:flex;gap:5px;"></div>
                        <button class="pg-btn" id="btnNext" disabled>Next ›</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const LIMIT = 15;
        let page = 1, pages = 1, timer = null;

        const FIELDS = { fGuard: "guard", fStatus: "status", fAction: "action", fAuth: "auth", fFrom: "date_from", fTo: "date_to", fQ: "q" };

        function filterParams() {
            const p = new URLSearchParams();
            for (const [id, key] of Object.entries(FIELDS)) {
                const v = document.getElementById(id).value.trim();
                if (v) p.set(key, v);
            }
            return p;
        }

        async function loadGuards() {
            const res = await API.get("/admin/guards");
            if (!res || res.status !== "good") return;
            const sel = document.getElementById("fGuard");
            res.data.forEach(g => sel.add(new Option(g[1], g[0])));  // Option() text is never parsed as HTML
        }

        function setStats(s) {
            document.getElementById("sTotal").textContent = s.total;
            document.getElementById("sAccepted").textContent = s.accepted;
            document.getElementById("sExpired").textContent = s.expired;
            document.getElementById("sFailed").textContent = s.failed;
            document.getElementById("sUnauth").textContent = s.unauthorized;
        }

        function badge(result) {
            const r = (result || "").toLowerCase();
            if (r === "accepted") return `<span class="badge badge-ok">✓ OK</span>`;
            if (r === "expired") return `<span class="badge badge-exp">⏰ EXP</span>`;
            return `<span class="badge badge-fail">✗ FAIL</span>`;
        }

        async function load(p = 1) {
            page = p;
            const from = document.getElementById("fFrom").value, to = document.getElementById("fTo").value;
            if (from && to && from > to) { showMessageModal("The 'From' date must be before the 'To' date.", "Invalid range"); return; }

            const q = filterParams();
            q.set("page", p); q.set("limit", LIMIT);
            const res = await API.get(`/admin/guard_scans?${q}`);
            const tbody = document.getElementById("body");

            if (!res || res.status !== "good") {
                tbody.innerHTML = `<tr class="empty-row"><td>${escapeHTML(res?.message || "Could not load history")}</td></tr>`;
                updatePager(0, 1, 1);
                return;
            }
            setStats(res.summary);
            pages = res.pages;

            if (!res.data.length) {
                tbody.innerHTML = `<tr class="empty-row"><td>📭 No scans match these filters</td></tr>`;
                updatePager(res.total, p, res.pages);
                return;
            }

            // [0 id, 1 date, 2 guard, 3 plate, 4 qr, 5 action, 6 result, 7 dept, 8 authorized]
            tbody.innerHTML = res.data.map(r => {
                const action = (r[5] || "entry").toLowerCase();
                const authorized = Number(r[8]) === 1;
                return `<tr>
                    <td class="mono" style="color:#94a3b8;">${escapeHTML(r[0])}</td>
                    <td class="mono" style="font-size:11px;color:#64748b;">${escapeHTML(String(r[1]).slice(0, 19))}</td>
                    <td style="color:#0f172a;font-weight:600;" title="${escapeHTML(r[2])}">${escapeHTML(r[2])}</td>
                    <td class="mono" style="color:#1e3a8a;font-weight:700;">${escapeHTML(r[3])}</td>
                    <td class="mono" style="font-size:11px;color:#2563eb;font-weight:700;" title="${escapeHTML(r[4])}">${escapeHTML(r[4])}</td>
                    <td>${escapeHTML(r[7] || "—")}</td>
                    <td><span class="${action === "exit" ? "action-exit" : "action-entry"}">${action === "exit" ? "EXIT" : "ENTRY"}</span></td>
                    <td>${badge(r[6])}</td>
                    <td>${authorized ? "Yes" : `<span title="Not authorized">🚩</span>`}</td>
                </tr>`;
            }).join("");

            updatePager(res.total, p, res.pages);
        }

        function updatePager(total, p, ps) {
            pages = ps;
            const info = `Page ${p} of ${ps} (${total} records)`;
            document.getElementById("pgInfo").textContent = info;
            document.getElementById("pgBottom").textContent = info;
            document.getElementById("btnPrev").disabled = p <= 1;
            document.getElementById("btnNext").disabled = p >= ps;

            const nums = document.getElementById("pgNums");
            nums.innerHTML = "";
            let start = Math.max(1, p - 2), end = Math.min(ps, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            for (let i = start; i <= end; i++) {
                const b = document.createElement("button");
                b.className = "pg-btn" + (i === p ? " active" : "");
                b.textContent = i;
                b.onclick = () => go(i);
                nums.appendChild(b);
            }
        }

        function go(p) { if (p >= 1 && p <= pages) load(p); }

        function clearFilters() {
            Object.keys(FIELDS).forEach(id => document.getElementById(id).value = "");
            load(1);
        }

        document.getElementById("btnApply").addEventListener("click", () => load(1));
        document.getElementById("btnClear").addEventListener("click", clearFilters);
        document.getElementById("btnPrev").addEventListener("click", () => go(page - 1));
        document.getElementById("btnNext").addEventListener("click", () => go(page + 1));
        document.getElementById("btnExport").addEventListener("click", () => {
            window.location.href = `/admin/guard_scans/export?${filterParams()}`;
        });
        ["fGuard", "fStatus", "fAction", "fAuth", "fFrom", "fTo"].forEach(id =>
            document.getElementById(id).addEventListener("change", () => load(1)));
        document.getElementById("fQ").addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(() => load(1), 350);
        });

        loadGuards();
        load(1);
        setInterval(() => load(page), 30000);
    </script>
</body>
</html>
