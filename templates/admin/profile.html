<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — GSD Parking</title>
    <link rel="stylesheet" href="/../../static/css/style.css">
    <link rel="stylesheet" href="/../../static/css/message.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="/../../static/scripts/scrit.js"></script>
    <style>
        /* ─── PAGE HEADER ─── */
        .page-header {
            background: #ffffff;
            border-bottom: 1px solid #c7d9f5;
            padding: 24px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 8px rgba(37,99,235,0.06);
        }
        .page-header h1 { font-size:22px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:10px; }
        .page-header h1 i { color:#2563eb; }
        .page-header p { font-size:11px; color:#94a3b8; font-family:'Space Mono',monospace; margin-top:4px; letter-spacing:.08em; text-transform:uppercase; }

        .inner { padding:28px 36px; max-width:860px; }

        /* ─── AVATAR BANNER ─── */
        .profile-banner {
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #0ea5e9);
            border-radius: 14px 14px 0 0;
            height: 110px;
            position: relative;
        }
        .avatar-wrap {
            position: absolute;
            bottom: -36px;
            left: 32px;
        }
        .avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: #dbeafe;
            border: 4px solid #ffffff;
            display: grid; place-items: center;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(37,99,235,0.2);
        }
        .admin-badge {
            position: absolute;
            top: 16px; right: 20px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 10px; font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
            font-family: 'Space Mono', monospace;
        }

        /* ─── PROFILE CARD ─── */
        .profile-card {
            background: #ffffff;
            border: 1px solid #c7d9f5;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(37,99,235,0.07);
            margin-bottom: 24px;
        }
        .profile-body {
            padding: 56px 32px 32px;
        }
        .profile-name {
            font-size: 20px; font-weight: 800; color: #0f172a;
            margin-bottom: 2px;
        }
        .profile-role {
            font-size: 11px; color: #94a3b8;
            font-family: 'Space Mono', monospace;
            letter-spacing: .1em; text-transform: uppercase;
            margin-bottom: 24px;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info-item {
            background: #f5f9ff; border: 1px solid #ddeaff;
            border-radius: 10px; padding: 14px 18px;
            display: flex; align-items: center; gap: 14px;
        }
        .info-icon {
            width: 36px; height: 36px;
            border-radius: 8px; background: #dbeafe;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; color: #2563eb;
        }
        .info-label {
            font-size: 9px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .12em;
            font-family: 'Space Mono', monospace; margin-bottom: 3px;
        }
        .info-value { font-size: 14px; font-weight: 600; color: #0f172a; }

        /* ─── SECTION TITLE ─── */
        .section-title {
            font-size: 12px; font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .12em;
            font-family: 'Space Mono', monospace;
            padding: 14px 22px; border-bottom: 1px solid #ddeaff;
            display: flex; align-items: center; gap: 10px;
            background: #f5f9ff;
        }
        .section-title::before {
            content: ''; width: 3px; height: 14px;
            background: #2563eb; flex-shrink: 0; border-radius: 2px;
        }
        .section-title i { color: #2563eb; }

        /* ─── FORM CARDS ─── */
        .form-card {
            background: #ffffff; border: 1px solid #c7d9f5;
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 1px 6px rgba(37,99,235,0.07);
            margin-bottom: 24px;
        }
        .form-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 10px; font-weight: 700; color: #94a3b8;
            letter-spacing: .14em; text-transform: uppercase;
            font-family: 'Space Mono', monospace;
        }
        .form-group input {
            padding: 11px 14px;
            background: #f8faff; border: 1.5px solid #c7d9f5;
            color: #0f172a; font-family: 'Syne', sans-serif;
            font-size: 14px; outline: none;
            transition: border-color .2s, box-shadow .2s;
            border-radius: 8px;
        }
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
            background: #ffffff;
        }
        .form-group input::placeholder { color: #cbd5e1; }

        .show-pw-row {
            display: flex; align-items: center; gap: 8px;
        }
        .show-pw-row label {
            font-size: 11px; color: #64748b; cursor: pointer;
            font-family: 'Space Mono', monospace; letter-spacing: 0;
            text-transform: none;
        }
        .show-pw-row input[type=checkbox] {
            width: 14px; height: 14px;
            accent-color: #2563eb; cursor: pointer;
        }

        .btn-save {
            align-self: flex-start;
            padding: 11px 24px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            border: none; color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 13px; font-weight: 800;
            cursor: pointer; letter-spacing: .06em;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            transition: all .2s; border-radius: 8px;
            box-shadow: 0 3px 12px rgba(37,99,235,.25);
        }
        .btn-save:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 5px 18px rgba(37,99,235,.35); }
        .btn-save:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        /* ─── HINT TEXT ─── */
        .hint {
            font-size: 11px; color: #94a3b8;
            font-family: 'Space Mono', monospace;
            letter-spacing: .04em;
        }
    </style>
</head>
<body>
    <!-- ─── SIDEBAR ─── -->
    <aside>
        <div class="logos">
            <div class="logo"><img src="https://www.freeiconspng.com/thumbs/car-icon-png/car-icon-png-25.png" alt="logo"></div>
            <h2>GSD Parking</h2>
        </div>
        <div class="butt">
            <p class="sml">Overview</p>
            <button onclick="window.location.href='/admin/dashboard'"><i class="bi bi-clipboard-data"></i> Dashboard</button>
            <p class="sml">Management</p>
            <button onclick="window.location.href='/admin/park'"><i class="bi bi-p-circle"></i> Parking</button>
            <button onclick="window.location.href='/admin/users'"><i class="bi bi-people-fill"></i> Manage Users</button>
            <p class="sml">Analytics</p>
            <button onclick="window.location.href='/admin/reports'"><i class="bi bi-graph-up-arrow"></i> Reports & Logs</button>
            <p class="sml">Account</p>
            <button class="active-nav" onclick="window.location.href='/admin/profile'"><i class="bi bi-person-circle"></i> Profile</button>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="window.location.href='/auth/logout'">
                <i class="bi bi-box-arrow-left"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ─── MAIN ─── -->
    <div class="right">
        <div class="page-header">
            <div>
                <h1><i class="bi bi-person-circle"></i> My Profile</h1>
                <p>Account Settings — Email & Password</p>
            </div>
        </div>

        <div class="inner">

            <!-- Info card -->
            <div class="profile-card">
                <div class="profile-banner">
                    <span class="admin-badge">👑 Administrator</span>
                    <div class="avatar-wrap">
                        <div class="avatar">🛡️</div>
                    </div>
                </div>
                <div class="profile-body">
                    <div class="profile-name" id="dispUsername">—</div>
                    <div class="profile-role">System Administrator</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-icon"><i class="bi bi-person-fill"></i></div>
                            <div>
                                <div class="info-label">Username</div>
                                <div class="info-value" id="dispUsername2">—</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="bi bi-envelope-fill"></i></div>
                            <div>
                                <div class="info-label">Email</div>
                                <div class="info-value" id="dispEmail">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Change email -->
            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-envelope-fill"></i> Change Email
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>New Email Address</label>
                        <input type="email" id="newEmail" placeholder="Enter new email address">
                    </div>
                    <span class="hint">This will also update your login email.</span>
                    <button class="btn-save" id="btnEmail" onclick="saveEmail()">
                        <i class="bi bi-envelope-check"></i> Update Email
                    </button>
                </div>
            </div>

            <!-- Change password -->
            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-lock-fill"></i> Change Password
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="currentPw" placeholder="Enter your current password">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPw" placeholder="Min. 8 characters">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPw" placeholder="Repeat new password">
                    </div>
                    <div class="show-pw-row">
                        <input type="checkbox" id="showPw" onchange="togglePwVisibility()">
                        <label for="showPw">Show passwords</label>
                    </div>
                    <span class="hint">Minimum 8 characters. You will stay logged in after changing.</span>
                    <button class="btn-save" id="btnPw" onclick="savePassword()">
                        <i class="bi bi-lock-fill"></i> Update Password
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ─── Load profile data ────────────────────────────
        async function loadProfile() {
            const res = await API.get("/admin/get_profile");
            if (res.status === "good") {
                document.getElementById("dispUsername").textContent  = res.username || "—";
                document.getElementById("dispUsername2").textContent = res.username || "—";
                document.getElementById("dispEmail").textContent     = res.email    || "—";
                document.getElementById("newEmail").placeholder      = res.email    || "Enter new email address";
            }
        }

        // ─── Toggle password visibility ───────────────────
        function togglePwVisibility() {
            const show = document.getElementById("showPw").checked;
            ["currentPw", "newPw", "confirmPw"].forEach(id => {
                document.getElementById(id).type = show ? "text" : "password";
            });
        }

        // ─── Save email ───────────────────────────────────
        async function saveEmail() {
            const email = document.getElementById("newEmail").value.trim();
            if (!email) {
                showMessageModal("Please enter a new email address.", "Missing Field");
                return;
            }

            const btn = document.getElementById("btnEmail");
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving…';

            const res = await API.put("/admin/update_email", { email });
            showMessageModal(res.message, res.status);

            if (res.status === "good") {
                document.getElementById("dispEmail").textContent = email;
                document.getElementById("newEmail").value = "";
                document.getElementById("newEmail").placeholder = email;
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-envelope-check"></i> Update Email';
        }

        // ─── Save password ────────────────────────────────
        async function savePassword() {
            const current_password  = document.getElementById("currentPw").value;
            const new_password      = document.getElementById("newPw").value;
            const confirm_password  = document.getElementById("confirmPw").value;

            if (!current_password || !new_password || !confirm_password) {
                showMessageModal("Please fill in all password fields.", "Missing Fields");
                return;
            }
            if (new_password.length < 8) {
                showMessageModal("New password must be at least 8 characters.", "Too Short");
                return;
            }
            if (new_password !== confirm_password) {
                showMessageModal("New passwords do not match.", "Mismatch");
                return;
            }

            const btn = document.getElementById("btnPw");
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving…';

            const res = await API.put("/admin/update_password", {
                current_password,
                new_password,
                confirm_password
            });
            showMessageModal(res.message, res.status);

            if (res.status === "good") {
                ["currentPw", "newPw", "confirmPw"].forEach(id => {
                    document.getElementById(id).value = "";
                });
                document.getElementById("showPw").checked = false;
                togglePwVisibility();
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-lock-fill"></i> Update Password';
        }

        loadProfile();
    </script>
</body>
</html>
