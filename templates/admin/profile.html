<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — GSD Parking</title>
    <link rel="stylesheet" href="/../../static/css/style.css">
    <link rel="stylesheet" href="/../../static/css/message.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="/../../static/scripts/scrit.js"></script>
    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }

        .page-header {
            background: #ffffff;
            border-bottom: 1px solid #000000;
            padding: 24px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: #2563eb;
        }

        .page-header p {
            font-size: 11px;
            color: #94a3b8;
            font-family: 'Roboto', sans-serif;
            margin-top: 4px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .inner {
            padding: 28px 36px;
            max-width: 860px;
        }

        .profile-banner {
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #0ea5e9);
            height: 12px;
            width: 100%;
            border-bottom: 1px solid #000000;
        }

        /* ─── INNER CONTAINER CARDS WITH BORDER RADIUS ─── */
        .profile-card {
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07);
            margin-bottom: 24px;
        }

        .profile-body {
            padding: 28px 32px 32px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .profile-role {
            font-size: 11px;
            color: #2563eb;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            background: #f5f9ff;
            border: 1px solid #000000;
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            background: #dbeafe;
            border: 1px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            color: #2563eb;
        }

        .info-label {
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .12em;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .12em;
            padding: 14px 22px;
            border-bottom: 1px solid #000000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f9ff;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: #2563eb;
            flex-shrink: 0;
            border-radius: 2px;
        }

        .section-title i {
            color: #2563eb;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07);
            margin-bottom: 24px;
        }

        .form-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .form-group input {
            padding: 11px 14px;
            background: #f8faff;
            border: 1.5px solid #000000;
            border-radius: 8px;
            color: #0f172a;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-group input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .1);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #cbd5e1;
        }

        .show-pw-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .show-pw-row label {
            font-size: 11px;
            color: #64748b;
            cursor: pointer;
            letter-spacing: 0;
            text-transform: none;
        }

        .show-pw-row input[type=checkbox] {
            width: 14px;
            height: 14px;
            accent-color: #2563eb;
            cursor: pointer;
            border: 1px solid #000000;
            border-radius: 3px;
        }

        .btn-save {
            align-self: flex-start;
            padding: 11px 24px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            border: 1px solid #000000;
            color: #fff;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: .06em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .2s;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .15);
        }

        .btn-save:hover {
            opacity: .9;
            transform: translateY(-1px);
            box-shadow: 0 5px 18px rgba(0, 0, 0, .25);
        }

        .btn-save:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: .04em;
        }

        #hiddenpassback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(128, 128, 128, 0.6);
            z-index: 9999;
            visibility:hidden;

        }

        .hiddenPass {
            width: 300px;
            border: 2px solid;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background:white;
        }
    </style>
</head>

<body>
    <aside>
        <div class="logos">
            <div class="logo"><img src="https://www.freeiconspng.com/thumbs/car-icon-png/car-icon-png-25.png"
                    alt="logo"></div>
            <h2>GSD Parking</h2>
        </div>
        <div class="butt">
            <p class="sml">Overview</p>
            <button onclick="window.location.href='/admin/dashboard'"><i class="bi bi-clipboard-data"></i>
                Dashboard</button>
            <p class="sml">Management</p>
            <button onclick="window.location.href='/admin/park'"><i class="bi bi-p-circle"></i> Parking</button>
            <button onclick="window.location.href='/admin/users'"><i class="bi bi-people-fill"></i> Manage
                Users</button>
            <p class="sml">Analytics</p>
            <button onclick="window.location.href='/admin/reports'"><i class="bi bi-graph-up-arrow"></i> Reports &
                Logs</button>
            <p class="sml">Account</p>
            <button class="active-nav" onclick="window.location.href='/admin/profile'"><i
                    class="bi bi-person-circle"></i> Profile</button>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="window.location.href='/auth/logout'">
                <i class="bi bi-box-arrow-left"></i> Logout
            </button>
        </div>
    </aside>

    <div class="right">
        <div class="page-header">
            <div>
                <h1><i class="bi bi-person-circle"></i> My Profile</h1>
                <p>Account Settings — Email & Password</p>
            </div>
        </div>

        <div class="inner">

            <div class="profile-card">
                <div class="profile-banner"></div>
                <div class="profile-body">
                    <div class="profile-name" id="dispUsername">—</div>
                    <div class="profile-role">System Administrator</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-icon"><i class="bi bi-person-fill"></i></div>
                            <div>
                                <div class="info-label">Username</div>
                                <div class="info-value" id="dispUsername2">—</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="bi bi-envelope-fill"></i></div>
                            <div>
                                <div class="info-label">Email</div>
                                <div class="info-value" id="dispEmail">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-person-fill"></i> Change Username
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>New Username Address</label>
                        <input type="text" id="newUsername" placeholder="Enter new username address">
                    </div>
                    <button class="btn-save" id="btnEmail" onclick="shwhidden()">
                        <i class="bi bi bi-person-fill"></i> Update Username
                    </button>
                </div>
            </div>





            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-envelope-fill"></i> Change Email
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>New Email Address</label>
                        <input type="email" id="newEmail" placeholder="Enter new email address">
                    </div>
                    <span class="hint">This will also update your login email.</span>
                    <button class="btn-save" id="btnEmail" onclick="saveEmail()">
                        <i class="bi bi-envelope-check"></i> Update Email
                    </button>
                </div>
            </div>

            <div class="form-card">
                <div class="section-title">
                    <i class="bi bi-lock-fill"></i> Change Password
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="currentPw" placeholder="Enter your current password">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPw" placeholder="Min. 8 characters">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPw" placeholder="Repeat new password">
                    </div>
                    <div class="show-pw-row">
                        <input type="checkbox" id="showPw" onchange="togglePwVisibility()">
                        <label for="showPw">Show passwords</label>
                    </div>
                    <span class="hint">Minimum 8 characters. You will stay logged in after changing.</span>
                    <button class="btn-save" id="btnPw" onclick="savePassword()">
                        <i class="bi bi-lock-fill"></i> Update Password
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div id="hiddenpassback">
        <div class="hiddenPass">
            <button onclick="hidehidden()" aria-label="Close">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="form-body">
                <div class="form-group">
                    <label>Enter Password</label>
                    <input type="text" id="hcpass" placeholder="Enter your password">
                </div>
                <button class="btn-save" onclick="changeUsername()">
                    <i class="bi bi-send"></i> confirm
                </button>
            </div>

        </div>

    </div>

    <script>
        async function loadProfile() {
            const res = await API.get("/admin/get_profile");
            if (res.status === "good") {
                document.getElementById("dispUsername").textContent = res.username || "—";
                document.getElementById("dispUsername2").textContent = res.username || "—";
                document.getElementById("dispEmail").textContent = res.email || "—";
                document.getElementById("newEmail").placeholder = res.email || "Enter new email address";
            }
        }

        function shwhidden() {
            let hp = document.getElementById("hiddenpassback");
            hp.style.visibility = "visible";
        }

        function hidehidden() {
            let hp = document.getElementById("hiddenpassback");
            hp.style.visibility = "hidden";
        }

        async function changeUsername() {
            let payload = {
                newusername :document.getElementById("newUsername").value,
                password : document.getElementById("hcpass").value
            }

            let res = await API.post("/admin/update_username",payload);
            showMessageModal(res.message ?? "", res.status??" ");

        }



        function togglePwVisibility() {
            const show = document.getElementById("showPw").checked;
            [ "currentPw", "newPw", "confirmPw" ].forEach(id => {
                document.getElementById(id).type = show ? "text" : "password";
            });
        }

        async function saveEmail() {
            const email = document.getElementById("newEmail").value.trim();
            if (!email) {
                showMessageModal("Please enter a new email address.", "Missing Field");
                return;
            }

            const btn = document.getElementById("btnEmail");
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving…';

            const res = await API.put("/admin/update_email", { email });
            showMessageModal(res.message, res.status);

            if (res.status === "good") {
                document.getElementById("dispEmail").textContent = email;
                document.getElementById("newEmail").value = "";
                document.getElementById("newEmail").placeholder = email;
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-envelope-check"></i> Update Email';
        }

        async function savePassword() {
            const current_password = document.getElementById("currentPw").value;
            const new_password = document.getElementById("newPw").value;
            const confirm_password = document.getElementById("confirmPw").value;

            if (!current_password || !new_password || !confirm_password) {
                showMessageModal("Please fill in all password fields.", "Missing Fields");
                return;
            }
            if (new_password.length < 8) {
                showMessageModal("New password must be at least 8 characters.", "Too Short");
                return;
            }
            if (new_password !== confirm_password) {
                showMessageModal("New passwords do not match.", "Mismatch");
                return;
            }

            const btn = document.getElementById("btnPw");
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Saving…';

            const res = await API.put("/admin/update_password", {
                current_password,
                new_password,
                confirm_password
            });
            showMessageModal(res.message, res.status);

            if (res.status === "good") {
                [ "currentPw", "newPw", "confirmPw" ].forEach(id => {
                    document.getElementById(id).value = "";
                });
                document.getElementById("showPw").checked = false;
                togglePwVisibility();
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-lock-fill"></i> Update Password';
        }

        loadProfile();
    </script>
</body>

</html>
