<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/../../static/scripts/scrit.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>qr code</title>
    <style>
        #pendingqr{
            border:2px solid;
        }

    </style>
</head>

<body>
    <aside>
        <div class="logos">
            <div class="circle">P</div>
            <span>USER PORTAL</span>
        </div>
        <div class="buttons">
            <a href="/users/status" class="active"><i class="bi bi-qr-code"></i> QR Status</a>
            <a href="/users/profile"><i class="bi bi-search"></i> Profile</a>
        </div>
        <div class="logout">
            <button onclick="window.location.href='/auth/logout'"><i class="bi bi-box-arrow-left"></i> Logout</button>
        </div>
    </aside>



    <div class="right">
        <div id="pendingqr">
            <table>
                <thead>
                    <tr>
                        <th>No. </th>
                        <th>Request Type</th>
                        <th>Request Status</th>
                        <th>Request date</th>
                    </tr>
                </thead>
                <tbody id="qrs">


                </tbody>
            </table>

        </div>

        <div class="request_qr">
            <form id="requestqr" onsubmit="requestqr(event)">
                <div>
                    <label for="plate">Plate</label>
                    <input id="plate" type="text" placeholder="123 ABC">
                </div>
                <div>
                    <label for="username">username</label>
                    <input id="username" type="text" placeholder="123 ABC">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" value="Sample@email.com" readonly>
                </div>
                <div>
                    <label for="phone_num">Phone</label>
                    <input type="text" id="number">
                </div>

                <div class="form-group">
                    <label>Vehicle Type</label>
                    <select id="vehicle_type">
                        <option value="car">Car — uses 1 parking space</option>
                        <option value="motorcycle">Motorcycle — uses half a parking space</option>
                    </select>
                </div>

                <div>
                    <button type="submit">Request QR</button>
                </div>
            </form>


        </div>
    </div>

    <script>
        let LIMIT = 5;
        let PAGE = 1;

        async function MyEmail() {
            let res = await API.get("/users/myemail");
            document.getElementById("email").value = escapeHTML(res.data.email);
        }


        async function fetchData() {
            try {
                let data = await API.get(`/users/get_request?page=${PAGE}&limit=${LIMIT}`);
                console.log(data)
                if (data) {
                    renderRequest(data.requests || data.data || []);
                    renderPagination(data.pages || 1);
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        function renderRequest(qrdata = []) {
            let qrs = document.getElementById("qrs");
            qrs.textContent = "";

            if (!qrdata || qrdata.length === 0) {
                qrs.innerHTML = `
                <tr>
                    <td colspan="3" style="text-align: center;">No data available</td>
                </tr>`;
                return;
            }

            let rowsHtml = "";
            qrdata.forEach((val,i) => {

                let alt = {
                    "request_qr": "Request QR",
                    "request_renewal": "QR Renewal"
                }
                
                rowsHtml += `<tr>
                <td>${escapeHTML(i+1)}</td>
                <td>${escapeHTML(alt[val[ 2 ]])}</td>
                <td>${escapeHTML(val[ 4 ])}</td>
                <td>${escapeHTML(val[ 6 ])}</td>
            </tr>`;
            });
            qrs.innerHTML = rowsHtml;
        }

        function renderPagination(totalPages) {
            let container = document.getElementById("pagination");

            if (!container) {
                container = document.createElement("div");
                container.id = "pagination";
                document.getElementById("pendingqr").appendChild(container);
            }

            container.innerHTML = `
            <button id="prevBtn" ${PAGE <= 1 ? 'disabled' : ''}>Previous</button>
            <span>Page ${PAGE} of ${totalPages}</span>
            <button id="nextBtn" ${PAGE >= totalPages ? 'disabled' : ''}>Next</button>
        `;

            document.getElementById("prevBtn").onclick = () => {
                if (PAGE > 1) {
                    PAGE--;
                    fetchData();
                }
            };

            document.getElementById("nextBtn").onclick = () => {
                if (PAGE < totalPages) {
                    PAGE++;
                    fetchData();
                }
            };
        }


        async function requestqr(event) {
            event.preventDefault();            

            let payload = {
                "plate": document.getElementById("plate").value,
                "user_name": document.getElementById("username").value,
                
                "email": document.getElementById("email").value,
                "phone": document.getElementById("number").value,
                "vtype": document.getElementById("vehicle_type").value
            }

            console.log("================================")
            console.log(payload)

            let res = await API.post("/users/add_request", payload);
            showMessageModal(res.message, res.status)
        }

        async function init() {
            await fetchData();
            await MyEmail();
        }

        init()

    </script>
</body>

</html>
