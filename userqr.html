<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/../../static/scripts/scrit.js"></script>
    <title>qr code</title>
    <style>

    </style>
</head>

<body>



    <div class="right">
        <div id="pendingqr">
            <table>
                <thead>
                    <tr>
                        <th>No. </th>
                        <th>Request Status</th>
                        <th>Request date</th>
                    </tr>
                </thead>
                <tbody id="qrs">


                </tbody>
            </table>

        </div>

        <div class="request_qr">
            <form id="requestqr" onsubmit="requestqr(event)">
                <div>
                    <label for="plate">Plate</label>
                    <input id="plate" type="text" placeholder="123 ABC">
                </div>
                <div>
                    <label for="username">username</label>
                    <input id="username" type="text" placeholder="123 ABC">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" value="Sample@email.com" readonly>
                </div>
                <div>
                    <label for="phone_num">Phone</label>
                    <input type="text" id="number">
                </div>

                <div class="form-group">
                    <label>Vehicle Type</label>
                    <select id="vehicle_type">
                        <option value="car">Car — uses 1 parking space</option>
                        <option value="motorcycle">Motorcycle — uses half a parking space</option>
                    </select>
                </div>

                <div>
                    <button type="submit">Request QR</button>
                </div>
            </form>


        </div>
    </div>

    <script>
        let LIMIT = 5;
        let PAGE = 1;

        async function fetchData() {
            try {
                let data = await API.get(`/users/get_request?page=${PAGE}&limit=${LIMIT}`);
                if (data) {
                    renderRequestQr(data.requests || data.data || []);
                    renderPagination(data.pages || 1);
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        function renderRequestQr(qrdata = []) {
            let qrs = document.getElementById("qrs");
            qrs.textContent = "";

            if (!qrdata || qrdata.length === 0) {
                qrs.innerHTML = `
                <tr>
                    <td colspan="3" style="text-align: center;">No data available</td>
                </tr>`;
                return;
            }

            let rowsHtml = "";
            qrdata.forEach((val) => {
                rowsHtml += `<tr>
                <td>${escapeHTML(val[ 0 ])}</td>
                <td>${escapeHTML(val[ 1 ])}</td>
                <td>${escapeHTML(val[ 2 ])}</td>
            </tr>`;
            });
            qrs.innerHTML = rowsHtml;
        }

        function renderPagination(totalPages) {
            let container = document.getElementById("pagination");

            if (!container) {
                container = document.createElement("div");
                container.id = "pagination";
                document.getElementById("pendingqr").appendChild(container);
            }

            container.innerHTML = `
            <button id="prevBtn" ${PAGE <= 1 ? 'disabled' : ''}>Previous</button>
            <span>Page ${PAGE} of ${totalPages}</span>
            <button id="nextBtn" ${PAGE >= totalPages ? 'disabled' : ''}>Next</button>
        `;

            document.getElementById("prevBtn").onclick = () => {
                if (PAGE > 1) {
                    PAGE--;
                    fetchData();
                }
            };

            document.getElementById("nextBtn").onclick = () => {
                if (PAGE < totalPages) {
                    PAGE++;
                    fetchData();
                }
            };
        }


        async function requestqr(event){
            event.preventDefault();
            let plate = document.getElementById("plate").value
            let username = document.getElementById("username").value
            let email = document.getElementById("email").value
            let number = document.getElementById("number").value
            let vehicle_type = document.getElementById("vehicle_type").value
            console.log(plate,username,email,number,vehicle_type)



        }


        //fetchData();
    </script>
</body>

</html>
